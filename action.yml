name: 'PromptDiff Regression Testing Action'
description: 'Run LLM regression tests against stored baselines, detect semantic drift, and generate PR comment reports.'
author: 'suprithasugumar'

inputs:
  config:
    description: 'Path to test suite YAML file'
    required: true
  baseline:
    description: 'Save this execution run as suite baseline (true/false)'
    required: false
    default: 'false'
  threshold:
    description: 'Cosine similarity threshold (0.0 - 1.0) for drift detection'
    required: false
    default: '0.88'
  fail-on:
    description: "Failure policy: 'any', 'hard', 'judge-worse', or 'none'"
    required: false
    default: 'any'
  max-regressions:
    description: 'Allowable number of regressed cases before exit code 1'
    required: false
    default: '0'
  markdown-report:
    description: 'Output path for generated markdown PR comment'
    required: false
    default: 'pr_comment.md'
  output-dir:
    description: 'Directory for JSON run artifacts'
    required: false
    default: 'runs'
  db-path:
    description: 'Path to SQLite database'
    required: false
    default: 'promptdiff.db'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run PromptDiff
      shell: bash
      run: |
        ARGS="${{ inputs.config }}"
        if [ "${{ inputs.baseline }}" = "true" ]; then
          ARGS="$ARGS --baseline"
        fi
        ARGS="$ARGS --threshold ${{ inputs.threshold }}"
        ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
        ARGS="$ARGS --max-regressions ${{ inputs.max-regressions }}"
        ARGS="$ARGS --output-dir ${{ inputs.output-dir }}"
        ARGS="$ARGS --db ${{ inputs.db-path }}"
        if [ -n "${{ inputs.markdown-report }}" ]; then
          ARGS="$ARGS --markdown-report ${{ inputs.markdown-report }}"
        fi

        echo "Executing: promptdiff run $ARGS"
        promptdiff run $ARGS
